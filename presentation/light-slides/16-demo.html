<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../light_slides/common.css">
</head>
<body>
  <div class="slide slide--dark">
    <span class="section-tag">PHASE II &middot; 시연</span>
    <span class="page-tag">16 / 18</span>

    <div class="accent-bar accent-bar--highlight"></div>
    <h2 class="t-headline">라이브 데모</h2>
    <div class="sp-48"></div>

    <div class="grid-3">
      <div class="dark-card">
        <div class="num-badge">1</div>
        <div class="sp-16"></div>
        <div class="dark-card__title">단일 문서 질의</div>
        <div class="sp-8"></div>
        <div class="dark-card__desc">"연차 일수가 어떻게 되나요?"</div>
        <div class="sp-8"></div>
        <div class="dark-card__tag">표준 RAG 흐름</div>
      </div>

      <div class="dark-card">
        <div class="num-badge">2</div>
        <div class="sp-16"></div>
        <div class="dark-card__title">복합 질의</div>
        <div class="sp-8"></div>
        <div class="dark-card__desc">"코드 리뷰 절차와 배포 프로세스는?"</div>
        <div class="sp-8"></div>
        <div class="dark-card__tag">다중 문서 + SSE</div>
      </div>

      <div class="dark-card dark-card--hero">
        <div class="num-badge num-badge--highlight">3</div>
        <div class="sp-16"></div>
        <div class="dark-card__title">답 없는 질의</div>
        <div class="sp-8"></div>
        <div class="dark-card__desc">"사내 식당 메뉴가 뭐예요?"</div>
        <div class="sp-8"></div>
        <div class="dark-card__tag dark-card__tag--highlight">Refusal 100% 시연</div>
      </div>
    </div>

    <div class="sp-32"></div>

    <div class="dark-metric">miss ~13.6s &rarr; hit 0ms</div>

    <!-- TODO: 스크린샷 교체 -->
    <div class="sp-16"></div>
    <div class="screenshot-placeholder">
      <span class="screenshot-placeholder__priority screenshot-placeholder__priority--must">MUST</span>
      <span class="screenshot-placeholder__label">라이브 데모 캡처</span>
      <span class="screenshot-placeholder__desc">실제 API 응답 (curl/httpie) 또는 Swagger UI 캡처 — 출처 포함 답변 + 거절 응답 + 캐시 히트</span>
    </div>
  </div>
</body>
</html>
