<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 01 · 사내 문서 Q&amp;A를 위한 RAG 시스템</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #F8F7F2;
      --bg-stage: #1e1e1c;
      --text: #1A1A1A;
      --ink: #0a0a0a;
      --text-muted: #5A5A5A;
      --text-subtle: #8A8A88;
      --rule-fine: #E5E3DC;
      --accent: #0F4C5C;
      --highlight: #D97706;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg-stage);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      transform: scale(min(calc((100vw - 48px) / 1920), calc((100vh - 48px) / 1080)));
      transform-origin: center center;
      box-shadow: 0 60px 120px rgba(0, 0, 0, 0.45), 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    /* subtle dot-grid background (barely visible) */
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(26, 26, 26, 0.045) 1px, transparent 0);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ---------- Top meta strip ---------- */
    .meta-top {
      position: absolute;
      top: 56px;
      left: 120px;
      right: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 15px;
      color: var(--text-subtle);
      letter-spacing: 0.02em;
      z-index: 2;
    }

    .page-indicator {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .page-indicator .dot {
      width: 9px;
      height: 9px;
      background: var(--accent);
      border-radius: 50%;
    }
    .page-indicator .current {
      color: var(--text);
      font-weight: 500;
    }
    .page-indicator .sep {
      opacity: 0.5;
    }

    .context-tag {
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.04em;
    }
    .context-tag .bar {
      width: 24px;
      height: 1px;
      background: var(--text-subtle);
      opacity: 0.6;
    }

    /* ---------- Main content ---------- */
    .content {
      position: absolute;
      left: 152px;
      right: 120px;
      top: 50%;
      transform: translateY(-54%);
      padding-left: 40px;
      border-left: 1px solid var(--rule-fine);
      z-index: 2;
    }
    .content::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 24%;
      bottom: 24%;
      width: 2px;
      background: var(--accent);
    }

    .eyebrow {
      font-size: 26px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 128px;
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.045em;
      color: var(--ink);
      margin-bottom: 56px;
    }

    .hrule {
      width: 96px;
      height: 2px;
      background: var(--ink);
      margin-bottom: 36px;
    }

    .subtitle {
      font-size: 28px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.4;
      letter-spacing: -0.005em;
      max-width: 1050px;
    }

    /* ---------- Bottom block ---------- */
    .bottom {
      position: absolute;
      left: 152px;
      right: 120px;
      bottom: 88px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 80px;
      z-index: 2;
    }

    .presenter {
      padding-left: 40px;
      border-left: 1px solid var(--rule-fine);
      position: relative;
    }
    .presenter::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--highlight);
    }
    .presenter .name {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    .presenter .meta {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      color: var(--text-subtle);
      letter-spacing: 0.03em;
    }
    .presenter .meta span {
      margin: 0 4px;
      opacity: 0.7;
    }

    .frame {
      max-width: 780px;
      text-align: right;
    }
    .frame-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 16px;
    }
    .frame-label::before {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--text-subtle);
      opacity: 0.7;
    }
    .frame-quote {
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
      letter-spacing: -0.008em;
    }
    .frame-quote .arrow {
      color: var(--text-subtle);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      margin: 0 10px;
      font-weight: 400;
    }
    .frame-quote .hl {
      color: var(--highlight);
      font-weight: 700;
      position: relative;
    }

    /* ---------- Corner decoration ---------- */
    .corner-mark {
      position: absolute;
      bottom: 56px;
      right: 120px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--text-subtle);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.6;
      z-index: 2;
    }

    /* Scrollbar polish */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="slide">
      <!-- Top meta strip -->
      <div class="meta-top">
        <div class="page-indicator">
          <span class="dot"></span>
          <span class="current">01</span>
          <span class="sep">/</span>
          <span>14</span>
        </div>
        <div class="context-tag">
          <span class="bar"></span>
          <span>OfficeAgent Interview · 2026.04.23</span>
        </div>
      </div>

      <!-- Main content -->
      <div class="content">
        <div class="eyebrow">사내 문서 Q&amp;A를 위한</div>
        <h1>RAG 시스템</h1>
        <div class="hrule"></div>
        <div class="subtitle">Claude SDK 기반 PoC와 프로덕션 확장을 위한 고민</div>
      </div>

      <!-- Bottom block -->
      <div class="bottom">
        <div class="presenter">
          <div class="name">배성환</div>
          <div class="meta">2026.04.23<span></div>
        </div>
        <div class="frame">
          <div class="frame-label">Lessons &amp; Learns</div>
          <div class="frame-quote">
            구현하며 배운 고민,<br>
            구현하고 나서 보인 <span class="hl">개선점</span>
          </div>
        </div>
      </div>

      <!-- Tiny corner mark -->
      <div class="corner-mark"></div>
    </div>
  </div>
</body>
</html>
