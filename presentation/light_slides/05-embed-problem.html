<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="common.css">
  <style>
    .slide {
      padding: 100px 160px;
      justify-content: center;
      gap: 0;
    }

    .points {
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin-top: 48px;
      max-width: 1100px;
    }

    .point {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .point__marker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      width: 24px;
    }

    .point__text {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .point__text strong {
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="slide">
    <span class="section-tag">Part I &middot; 구현하며 배운 것</span>
    <span class="page-tag">05 / 19</span>

    <div class="accent-bar"></div>
    <p class="t-label" style="margin-bottom: 16px;"><span class="accent">임베딩 &amp; 청킹</span> &mdash; 고민</p>
    <h1 class="t-hero">문서를 어떻게 자르고,<br>어떻게 찾을까?</h1>

    <div class="points">
      <div class="point">
        <span class="point__marker">&mdash;</span>
        <span class="point__text">포맷이 다양하다 &mdash; <strong>PDF &middot; MD &middot; TXT</strong></span>
      </div>
      <div class="point">
        <span class="point__marker">&mdash;</span>
        <span class="point__text">한국어 &middot; 영어가 <strong>혼재</strong>한다</span>
      </div>
      <div class="point">
        <span class="point__marker">&mdash;</span>
        <span class="point__text">답변에 <strong>출처 추적</strong>이 필수다</span>
      </div>
    </div>
  </div>
</body>
</html>
