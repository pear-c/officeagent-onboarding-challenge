<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="common.css">
  <style>
    .slide {
      justify-content: flex-end;
      padding-bottom: 180px;
    }

    .title-block {
      max-width: 960px;
    }

    .title-main {
      font-size: 76px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.035em;
      color: var(--text);
    }

    .title-main .em {
      color: var(--accent);
    }

    .title-sub {
      margin-top: 24px;
      font-size: 22px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .title-badge {
      display: inline-block;
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 6px 16px;
      border-radius: 20px;
    }

    .title-meta {
      margin-top: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .title-meta .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .accent-line {
      position: absolute;
      left: 160px;
      top: 140px;
      width: 4px;
      height: 120px;
      background: var(--accent);
      border-radius: 2px;
    }

    .glow {
      position: absolute;
      right: -100px;
      bottom: -100px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(160px);
      opacity: 0.03;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="accent-line"></div>

    <div class="title-block">
      <h1 class="title-main">
        사내 문서 Q&A를 위한<br>
        <span class="em">RAG 시스템</span>
      </h1>
      <p class="title-sub">
        Claude SDK 기반 PoC — 설계 의도와 자기 검증
      </p>
      <div class="title-badge">완성품 자랑이 아닌, 현재 상태의 정확한 지도</div>

      <div class="title-meta">
        <span>배성환</span>
        <span class="dot"></span>
        <span>OfficeAgent BE</span>
        <span class="dot"></span>
        <span>2026.04.23</span>
      </div>
    </div>

    <span class="page-tag">01 / 12</span>
  </div>
</body>
</html>
